<!doctype html><html lang="en" data-theme="today"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Today: the status of every watched employer and the job postings that are new or removed since the last daily run."><meta name="theme-color" content="#040c0d"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><link rel="preload" href="fonts/share-tech-mono.woff2" as="font" type="font/woff2" crossorigin><link rel="preload" href="fonts/michroma.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="app.css">
<script>try{var d=document.documentElement;if(!sessionStorage.getItem("job-watcher-booted")&&!navigator.webdriver&&location.hash.length<2&&!matchMedia("(prefers-reduced-motion: reduce)").matches&&localStorage.getItem("job-watcher-fx")!=="off"){d.classList.add("intro");setTimeout(function(){d.classList.remove("intro")},15000)}}catch(e){}</script><title>Job Watcher: Today</title></head>
<body><main id="main"><h1>Today</h1><p class="sub" id="sub">Loading…</p><div class="grid"><div class="skel tall"></div><div class="skel tall"></div><div class="skel tall"></div><div class="skel tall"></div></div><div class="skel panel"></div></main>
<script src="sfx.js"></script>
<script src="app.js"></script>
<script>
loadData().then(({ rows, status }) => {
  const day = lastRunDate(status), names = sourceNames(rows);
  const fresh = rows.filter(r => r.first_seen === day && !r.first_run);
  const gone = rows.filter(r => r.removed_date === day);
  let roleOnly = false;                      // both lists show every posting by default
  let srcOnly = "";                          // a source key while one source pill is selected
  // Yesterday = the latest earlier day any posting was listed. Everything below is worked out from the history file.
  let prev = ""; for (const r of rows) if (r.last_seen < day && r.last_seen > prev) prev = r.last_seen;
  let d = null, listedPrev = null;
  if (prev) {
    listedPrev = new Map(); let openPrev = 0, newPrev = 0, remPrev = 0;
    for (const r of rows) {
      if (r.first_seen <= prev && r.last_seen >= prev) listedPrev.set(r.source, (listedPrev.get(r.source) || 0) + 1);
      if (r.first_seen <= prev && !(r.removed_date && r.removed_date <= prev)) openPrev++;
      if (r.first_seen === prev && !r.first_run) newPrev++;
      if (r.removed_date === prev) remPrev++;
    }
    d = { open: status.open - openPrev, fresh: status.new_today - newPrev, gone: status.removed_today - remPrev };
  }
  const delta = n => n === null || n === undefined ? "" : n === 0 ? "no change vs yesterday" : `${n > 0 ? "▲" : "▼"} ${Math.abs(n).toLocaleString()} vs yesterday`;
  const pillDelta = s => { if (!s.ok || !listedPrev || !listedPrev.has(s.name)) return ""; const n = s.count - listedPrev.get(s.name); return n ? `<span class="d">${n > 0 ? "▲" : "▼"} ${Math.abs(n).toLocaleString()}</span>` : ""; };
  const expanded = { new: false, gone: false };
  const stat = (n, l, cls = "", change = null) => `<div class="tile stat ${cls}" tabindex="0"><div class="n">${n.toLocaleString()}</div><div class="l">${l}</div>${change === null ? "" : `<div class="d">${delta(change)}</div>`}</div>`;
  const item = r => `<a class="tile post" href="${esc(safeUrl(r.url))}" rel="noopener" target="_blank">${mono(r.employer, false, r.source)}<div class="body"><div class="ttl">${r.in_role ? `<span class="tag" title="${ROLE_TIP}">in role</span>` : ""}${esc(r.title)}</div><div class="meta">${esc(r.employer)} · ${esc(r.location) || "no location"}</div></div></a>`;
  // In-role postings come first. The whole list is in the page; a long one shows its first rows until "Show all".
  const list = (rs, key, what) => {
    rs = (srcOnly ? rs.filter(r => r.source === srcOnly) : rs); rs = (roleOnly ? rs.filter(r => r.in_role) : rs).slice().sort((a, b) => b.in_role - a.in_role || a.employer.localeCompare(b.employer));
    if (!rs.length) return { n: 0, html: `<p class="meta">None ${roleOnly ? "in role " : ""}${srcOnly ? "from " + esc(names[srcOnly] || srcOnly) + " " : ""}in the latest run.</p>` };
    const long = rs.length > 12;
    return { n: rs.length, html: `<div class="tiles${long && !expanded[key] ? " collapsed" : ""}" id="tiles-${key}">${rs.map(item).join("")}</div>` +
      (long ? `<p class="more"><button class="btn" type="button" data-expand="${key}">${expanded[key] ? "Show fewer" : `Show all ${rs.length.toLocaleString()} ${what}`}</button></p>` : "") };
  };
  const draw = () => {
    const n = list(fresh, "new", "new postings"), g = list(gone, "gone", "removed postings");
    document.getElementById("lists").innerHTML = `
      <div class="section bare"><h2>New postings<span class="count">${n.n.toLocaleString()}</span></h2>${n.html}</div>
      <div class="section bare"><h2>Removed postings<span class="count">${g.n.toLocaleString()}</span></h2>${g.html}</div>`;
    document.getElementById("allBtn").classList.toggle("on", !roleOnly);
    document.getElementById("roleBtn").classList.toggle("on", roleOnly);
    document.querySelectorAll("[data-src]").forEach(b => { b.classList.toggle("on", b.dataset.src === srcOnly); b.setAttribute("aria-pressed", b.dataset.src === srcOnly); });
    document.querySelector(".pills").classList.toggle("filtering", !!srcOnly);
    const note = document.getElementById("srcNote");
    note.hidden = !srcOnly;
    note.innerHTML = srcOnly ? `Showing only ${esc(names[srcOnly] || srcOnly)} <button class="btn" type="button" id="clearSrc">Show all sources</button>` : "";
    if (srcOnly) document.getElementById("clearSrc").onclick = () => { srcOnly = ""; draw(); };
  };
  document.getElementById("main").innerHTML = `
    <h1>Today</h1>
    <p class="sub">Watching since ${esc(status.first_run_date)}</p>
    <div class="grid">${stat(status.days_with_success, "days with a successful run")}${stat(status.open, "open postings", "", d && d.open)}${stat(status.new_today, "new today", "hot", d && d.fresh)}${stat(status.removed_today, "removed today", "cold", d && d.gone)}</div>
    <div class="section"><h2>Sources</h2><p class="meta">Status as of the last run, ${esc(status.run_time.slice(0, 10))} ${esc(status.run_time.slice(11, 16))} UTC. Click a source to show only its postings in the lists below.</p><div class="pills">${status.sources.map(s => `<button type="button" class="pill ${s.ok ? "ok" : "bad"}" data-src="${esc(s.name)}" aria-pressed="false">${esc(names[s.name] || s.name)} · ${s.ok ? s.count.toLocaleString() : "failed"}${pillDelta(s)}</button>`).join("")}</div></div>
    <div class="listbar"><div class="seg"><button id="allBtn" class="btn on" type="button">All postings</button><button id="roleBtn" class="btn" type="button">In role</button></div>${ROLE_BTN}</div>
    <p class="srcnote" id="srcNote" hidden></p>
    <div id="lists"></div>`;
  document.querySelector(".pills").addEventListener("click", e => {
    const b = e.target.closest("[data-src]"); if (!b) return;
    srcOnly = srcOnly === b.dataset.src ? "" : b.dataset.src; draw();
  });
  document.getElementById("allBtn").onclick = () => { roleOnly = false; draw(); };
  document.getElementById("roleBtn").onclick = () => { roleOnly = true; draw(); };
  document.getElementById("lists").addEventListener("click", e => {
    const b = e.target.closest("[data-expand]"); if (!b) return;
    expanded[b.dataset.expand] = !expanded[b.dataset.expand]; draw();
  });
  draw();
}).catch(showError);
</script></body></html>
