<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#04060c"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="app.css"><title>Job Watcher: Today</title></head>
<body><main id="main"><h1>Today</h1><p class="sub" id="sub">Loading…</p><div class="grid"><div class="skel tall"></div><div class="skel tall"></div><div class="skel tall"></div><div class="skel tall"></div></div><div class="skel panel"></div></main>
<script src="app.js"></script>
<script>
loadData().then(({ rows, status }) => {
  const day = lastRunDate(status);
  const fresh = rows.filter(r => r.first_seen === day && !r.first_run);
  const gone = rows.filter(r => r.removed_date === day);
  let roleOnly = false;                      // both lists show every posting by default
  const expanded = { new: false, gone: false };
  const stat = (n, l, cls = "") => `<div class="tile stat ${cls}" tabindex="0"><div class="n">${n.toLocaleString()}</div><div class="l">${l}</div></div>`;
  const item = r => `<a class="tile post" href="${esc(safeUrl(r.url))}" rel="noopener" target="_blank">${mono(r.employer)}<div class="body"><div class="ttl">${r.in_role ? '<span class="tag">in role</span>' : ""}${esc(r.title)}</div><div class="meta">${esc(r.employer)} · ${esc(r.location) || "no location"}</div></div></a>`;
  // In-role postings come first. The whole list is in the page; a long one shows its first rows until "Show all".
  const list = (rs, key, what) => {
    rs = (roleOnly ? rs.filter(r => r.in_role) : rs).slice().sort((a, b) => b.in_role - a.in_role || a.employer.localeCompare(b.employer));
    if (!rs.length) return { n: 0, html: `<p class="meta">None ${roleOnly ? "in role " : ""}in the latest run.</p>` };
    const long = rs.length > 12;
    return { n: rs.length, html: `<div class="tiles${long && !expanded[key] ? " collapsed" : ""}" id="tiles-${key}">${rs.map(item).join("")}</div>` +
      (long ? `<p class="more"><button class="btn" type="button" data-expand="${key}">${expanded[key] ? "Show fewer" : `Show all ${rs.length.toLocaleString()} ${what}`}</button></p>` : "") };
  };
  const draw = () => {
    const n = list(fresh, "new", "new postings"), g = list(gone, "gone", "removed postings");
    document.getElementById("lists").innerHTML = `
      <div class="section bare"><h2>New postings<span class="count">${n.n.toLocaleString()}</span></h2>${n.html}</div>
      <div class="section bare"><h2>Removed postings<span class="count">${g.n.toLocaleString()}</span></h2>${g.html}</div>`;
    document.getElementById("allBtn").classList.toggle("on", !roleOnly);
    document.getElementById("roleBtn").classList.toggle("on", roleOnly);
  };
  document.getElementById("main").innerHTML = `
    <h1>Today</h1>
    <p class="sub">Last run: ${esc(status.run_time)} · watching since ${esc(status.first_run_date)}</p>
    <div class="grid">${stat(status.days_with_success, "days with a successful run")}${stat(status.open, "open postings")}${stat(status.new_today, "new today", "hot")}${stat(status.removed_today, "removed today", "cold")}</div>
    <div class="section"><h2>Sources</h2><div class="pills">${status.sources.map(s => `<span class="pill ${s.ok ? "ok" : "bad"}">${esc(s.name)} · ${s.ok ? s.count.toLocaleString() : "failed"}</span>`).join("")}</div></div>
    <div class="listbar"><div class="seg"><button id="allBtn" class="btn on" type="button">All postings</button><button id="roleBtn" class="btn" type="button">In role</button></div></div>
    <div id="lists"></div>`;
  document.getElementById("allBtn").onclick = () => { roleOnly = false; draw(); };
  document.getElementById("roleBtn").onclick = () => { roleOnly = true; draw(); };
  document.getElementById("lists").addEventListener("click", e => {
    const b = e.target.closest("[data-expand]"); if (!b) return;
    expanded[b.dataset.expand] = !expanded[b.dataset.expand]; draw();
  });
  draw();
}).catch(showError);
</script></body></html>
