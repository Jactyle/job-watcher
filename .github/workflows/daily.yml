name: daily
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  pages: write
concurrency: daily
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pipeline.run
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Commit data
        run: |
          git config user.name "job-watcher[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git commit -m "data: run $(date -u +%F)" || echo "nothing to commit"
          git pull --rebase
          git push
      - name: Rebuild Pages
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
        env:
          GH_TOKEN: ${{ github.token }}
